<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .welcome{
            max-width: 250px;
            background-color: red;
            color: white;
            padding: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <p id="PaingHmue">Welcom to My Wold</p>

    <input type="text" id="name">



    <script src="jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#PaingHmue').mouseover(function(){
                $(this).addClass('welcome');
            });
             
            $('#PaingHmue').mouseout(function(){
                $(this).removeClass('welcome');
            });

            $('#name').focus(function(){
                $(this).css({'background-color':'red'});
            })
        })
    </script>
</body>
</html>
