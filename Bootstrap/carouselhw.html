<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
         <h1 class="text-center text-danger my-5">Carousel Homework</h1>

         <div class="container">
            <div class="carousel slide carousel-fade" data-bs-ride="carousel" id="Carousel">
                <div class="carousel-inner">
                   
                    <div class="carousel-item active ">
                        <img src="images/red 1.jpg" alt="" class="img-fluid w-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h1>Redmi Note 14 Pro</h1>
                            <h3>Redmi Note 14 Pro is a smartphone that offers a great balance of performance and affordability.</h3>
                        </div>
                    </div>
                  

                    <div class="carousel-item ">
                        <img src="images/redmi-note-14-por+.jpg" alt="" class="img-fluid w-100">
                        <div class="carousel-caption d-none d-md-block">
                            <h1>Redmi Note 14 Pro +</h1>
                            <h3>Redmi Note 14 Pro + is a smartphone that offers a great balance of performance and affordability.</h3>
                        </div>
                    </div>
                   
                
                    <div class="carousel-indicators">
                        <button class="active" data-bs-target="#Carousel" data-bs-slide-to="0"></button>
                        <button data-bs-target="#Carousel" data-bs-slide-to="1"></button>
                    </div>
               </div>


                <a href="#Carousel" class="carousel-control-prev" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </a>

                <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#Carousel">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>









     <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
