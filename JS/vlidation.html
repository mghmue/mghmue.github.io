<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
</head>
<body>
    <h1>Form Validation</h1>
    <form action="register.php" onsubmit="return checkValue()">
        <label for="name">Name</label><br>
        <input type="text" id="name"><br><br>
        <p id="nameErrorMessage"></p>

        <label for="email">Email</label><br>
        <input type="email" id="email"><br><br>
        <p id="emailErrorMessage"></p>

        <label for="password">Password</label><br>
        <input type="password" id="password"><br><br>
        <p id="passwordErrorMessage"></p>

        <label for="confirm_password">Confirm Password</label><br>
        <input type="password" id="confirm_password"><br><br>
        <p id="confrim_passwordErrorMessage"></p>

        <input type="submit" value="Register">
   </form>

   <script>
      function checkValue(){
           // alert("Hello");

             let name = document.getElementById('name').value;
             let email = document.getElementById('email').value;
             let password = document.getElementById('password').value;
             let confirm_password = document.getElementById('confirm_password').value;
    
            if (name != "" && email != "" && password != "" && confirm_password != "") { 
            return true;
            }else{
               if (name == "") {
                 var nameError = document.getElementById('name');
                 var nameErrorMessage = document.getElementById('nameErrorMessage');
                 nameError.style.border = "1px solid red";
                 nameErrorMessage.innerText = "Name is required";
                 nameErrorMessage.style.color = "red";
                }
                
               if (name != "") {
                 nameError.style.border = "1px solid red";
                 nameErrorMessage.innerText = "";
                }

               if (email == "") {
                 var emailError=document.getElementById('email');
                 var emailErrorMessage = document.getElementById('emailErrorMessage');
                 emailError.style.border = "1px solid red"
                 emailErrorMessage.innerText = "Email is required";
                 emailErrorMessage.style.color = 'red';
               }
               
               if (email != "") {
                    emailError.style.border = "1px solid black";
                    emailErrorMessage.innerText = "";
                }

                if (password == "") {
                  var passwordError = document.getElementById('password');
                  var passwordErrorMessage = document.getElementById('passwordErrorMessage');
                  passwordError.style.border = "1px solid red";
                  passwordErrorMessage.innerText = "Password is required";
                  passwordErrorMessage.style.color = "red";
                }

                if (password != "") {
                    passwordError.style.border = "1px solid black";
                    passwordErrorMessage.innerText = "";
                }

                if (confirm_password == "") {
                  var confirm_passwordError = document.getElementById('confirm_password');
                  var confirm_passwordErrorMessage = document.getElementById('con_passwordErrorMessage');
                  confirm_passwordError.style.border = "1px solid red";
                  confirm_passwordErrorMessage.innerText = "Confirm Password is required";
                  confirm_passwordErrorMessage.style.color = "red";
                }
                
                if (confirm_password != "") {
                    confirm_passwordError.style.border = "1px solid black";
                    confirm_passwordErrorMessage.innerText = "";
                }

                if (confirm_password != password) {
                    confirm_passwordError.style.border = "1px solid red";
                    confirm_passwordErrorMessage.innerText = "Password don't match!";
                    confirm_passwordErrorMessage.style.color = "red";
                }
                return false;
              }
            }
        
    
</script>
</body>
</html>
